name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-web:
    name: Build Web Converter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd web && npm ci
      - name: Build
        run: cd web && npx webpack --config webpack.config.js
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heic2jpg-web
          path: web/dist/index.html

  build-cli:
    name: Build CLI (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
            ldflags: '-extldflags "-static"'
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
            ldflags: '-extldflags "-static"'
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: ''
            ldflags: ''
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
            ldflags: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: go build -ldflags '${{ matrix.ldflags }}' -o heic2jpg-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heic2jpg-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/heic2jpg-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: [build-web, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
